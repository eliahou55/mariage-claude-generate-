# Le site est pre-genere (dist/ est commite dans le depot) : invitation_mariage.xlsx
# n'est pas dans le depot (donnees familiales privees), donc "npm run build" ne
# peut pas s'executer ici. On publie directement dist/ sans etape de build.

[build]
  publish = "dist"
  command = "echo 'dist/ est deja genere, aucune etape de build necessaire.'"

# La racine du site ouvre desormais l'espace client (accueil du produit :
# configurateur + formulaire), qui est la vraie porte d'entree pour les
# futurs clients. L'invitation Ilan & Yael (generee depuis l'Excel) reste
# consultable directement sur /index.html et /apercu/.
# Redirection reelle (302, pas une reecriture) pour que l'URL devienne
# /client/ et que les liens relatifs de cette page continuent de marcher.
[[redirects]]
  from = "/"
  to = "/client/"
  status = 302
  force = true
